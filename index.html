<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprintax — Organisation Structure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#2999A0; --teal-d:#1a6f74; --teal-l:#e6f3f4;  /* matched to SharePoint theme teal */
    --navy:#1B2733; --muted:#5A6B7B; --coral:#E66D62;
    --line:#b9cace; --bg:#f4f6f7; --card:#fff; --chip:#eef3f4;
    --shadow:0 1px 2px rgba(27,39,51,.06),0 6px 18px rgba(27,39,51,.06);
    --conn:2px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Poppins',Arial,Helvetica,sans-serif;color:var(--navy);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.35}
  a{color:inherit;text-decoration:none}

  header.banner{display:flex;align-items:center;justify-content:center;padding:22px 22px;background:var(--teal)}
  header.banner img.logo{height:40px;width:auto;display:block}

  .toolbar{position:sticky;top:0;z-index:35;background:#fff;border-bottom:1px solid var(--line);padding:10px 18px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .tab{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:500;cursor:pointer;transition:.12s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .tab .n{font-size:10.5px;opacity:.7}
  .tab:hover{border-color:var(--teal);color:var(--teal)}
  .tab.active{background:var(--teal);border-color:var(--teal);color:#fff}
  .tab.dept{border-style:dashed}
  .tab.dept.active{border-style:solid}
  .tab .x{font-size:13px;line-height:1;opacity:.7;margin-left:2px}
  .tab .x:hover{opacity:1}
  .tabsep{width:1px;height:20px;background:var(--line);margin:0 3px}
  .spacer{flex:1 1 auto}
  .search{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:190px}
  .search input{border:0;outline:0;font-family:inherit;font-size:13px;width:100%;background:transparent;color:var(--navy)}
  .toggle{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px}
  .toggle input{accent-color:var(--teal);width:15px;height:15px}
  .zoomctl{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
  .zoomctl .btn{border:0;border-radius:0;border-right:1px solid var(--line)}
  .zoomctl .btn:last-child{border-right:0}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-family:inherit;font-size:12.5px;color:var(--muted);cursor:pointer}
  .btn:hover{color:var(--teal)}
  .zlabel{min-width:38px}

  .crumbs{padding:12px 26px 0;font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .crumbs a{color:var(--teal-d);cursor:pointer}
  .crumbs a:hover{text-decoration:underline}
  .crumbs .sep{opacity:.5}
  .crumbs .cur{color:var(--navy);font-weight:600}

  .canvas{padding:20px 26px 60px;overflow-x:auto}
  .tree{width:max-content;margin:0 auto;transform-origin:top center}

  /* connectors */
  .tree ul{position:relative;padding-top:24px;display:flex;justify-content:center}
  .tree li{list-style:none;position:relative;padding:24px 12px 0;text-align:center;display:flex;flex-direction:column;align-items:center}
  .tree li::before,.tree li::after{content:'';position:absolute;top:0;right:50%;width:50%;height:24px;border-top:var(--conn) solid var(--line)}
  .tree li::after{right:auto;left:50%;border-left:var(--conn) solid var(--line)}
  .tree li:only-child::before,.tree li:only-child::after{display:none}
  .tree li:first-child::before,.tree li:last-child::after{border:0 none}
  .tree li:last-child::before{border-right:var(--conn) solid var(--line)}
  .tree ul ul::before{content:'';position:absolute;top:0;left:calc(50% - (var(--conn)/2));width:0;height:24px;border-left:var(--conn) solid var(--line)}
  .tree>ul{padding-top:0}
  .tree>ul>li{padding-top:0}
  .tree>ul>li::before,.tree>ul>li::after{display:none}

  .node{display:inline-block;vertical-align:top;text-align:left}
  .apex{background:var(--teal);color:#fff;border-radius:10px;padding:12px 22px;min-width:230px;max-width:340px;text-align:center;box-shadow:var(--shadow)}
  .apex .role{font-weight:600;font-size:14.5px;line-height:1.25}
  .apex .meta{font-size:11px;opacity:.92;margin-top:3px}
  .apex a.role-link{color:#fff;border-bottom:1px solid rgba(255,255,255,.55)}
  .apex a.role-link:hover{border-bottom-color:#fff}
  .apex a.cf-apex{color:#fff;border-bottom:1.5px solid rgba(255,255,255,.6)}

  /* clickable summary cards (function / department) */
  .navcard{background:#fff;border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:10px;padding:14px 16px;min-width:190px;max-width:215px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,box-shadow .12s;text-align:left}
  .navcard:hover{transform:translateY(-2px);box-shadow:0 5px 14px rgba(27,39,51,.13);border-color:var(--teal)}
  .navcard .ttl{font-weight:600;font-size:14px;color:var(--teal-d)}
  .navcard .hd{font-size:12px;color:var(--navy);margin-top:6px;font-weight:500}
  .navcard .hd small{display:block;color:var(--muted);font-weight:400;font-size:10.5px;margin-top:1px}
  .navcard .cnt{font-size:10.5px;color:var(--muted);margin-top:9px;display:flex;justify-content:space-between;align-items:center}
  .navcard .open{color:var(--teal);font-weight:600}

  .leadbox{background:#fff;border:2px solid var(--teal);border-radius:10px;text-align:left;min-width:200px;max-width:240px;box-shadow:var(--shadow);overflow:hidden}
  .unit{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);text-align:left;width:212px}
  .unit-h{background:var(--teal-l);border-bottom:1px solid var(--line);padding:8px 11px}
  .unit-h .u{font-weight:600;font-size:12.5px;color:var(--teal-d)}
  .unit-h a.cf{color:var(--teal-d);border-bottom:1.5px solid var(--teal)}
  .unit-h a.cf:hover{background:rgba(30,127,142,.06)}
  .unit-h .cfhint{display:block;font-size:9.5px;color:var(--muted);font-weight:400;margin-top:1px}

  .roles{display:flex;flex-direction:column}
  .role-card{padding:8px 11px;border-top:1px solid #eef1f2}
  .role-card:first-child{border-top:0}
  .role-card .rt{font-size:12px;font-weight:500;line-height:1.25}
  .role-card a.jd{color:var(--teal-d);border-bottom:1.5px solid var(--teal);cursor:pointer}
  .role-card a.jd:hover{background:rgba(30,127,142,.06)}
  .rmeta{display:flex;align-items:center;gap:7px;margin-top:4px;flex-wrap:wrap}
  .chip{background:var(--chip);color:var(--muted);border-radius:5px;padding:1px 7px;font-size:10px;font-weight:600;letter-spacing:.3px}
  .sal{font-size:10.5px;color:var(--muted)}
  .flag{font-size:9.5px;color:var(--coral);border:1px solid var(--coral);border-radius:5px;padding:0 5px;font-weight:600}
  .ext{display:inline-block;width:9px;height:9px;margin-left:3px;vertical-align:baseline;opacity:.6}

  .note{max-width:760px;margin:0 auto 18px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:8px;padding:11px 14px;font-size:12px;color:var(--muted)}
  .empty{color:var(--muted);font-size:12px;padding:6px;text-align:center}

  .role-card.dim,.unit.dim,.leadbox.dim,.navcard.dim{opacity:.26}
  .role-card.hit,.navcard.hit{outline:2px solid var(--coral);outline-offset:-2px;border-radius:8px;background:rgba(230,109,98,.08)}

  footer{padding:14px 26px 40px;color:var(--muted);font-size:11px;text-align:center}
  .legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:14px;height:14px;border-radius:3px;display:inline-block}

  @media print{.toolbar,.crumbs,#printBtn,.zoomctl{display:none!important}.canvas{overflow:visible}body{background:#fff}}
</style>
</head>

const OKLVL=new Set(['IC1','IC2','IC3','IC4','IC5','M1','M2']);
const lvlOK=l=>OKLVL.has(l);

/* ---- lead / team classification for a department ---- */
function classify(d){
  const units=d.units||[];
  const si=units.findIndex(u=>u.unit===d.dept);
  const others=units.filter((u,i)=>i!==si);
  if(si>=0 && others.length>0) return {mode:'lead', lead:units[si], teams:others};
  if(units.length===1 && si===0) return {mode:'bare', bare:units[0]};
  return {mode:'teams', teams:units};
}
function deptStats(d){
  const c=classify(d);
  const roleCount=(d.units||[]).reduce((n,u)=>n+u.roles.length,0);
  const leadTitle=c.mode==='lead'?c.lead.roles[0].title:'';
  const teamCount=c.mode==='lead'?c.teams.length:(c.mode==='bare'?1:c.teams.length);
  return {roleCount,leadTitle,teamCount};
}

function roleTitleHTML(r){const t=esc(r.title);return r.jd?`<a class="jd" href="${esc(r.jd)}" target="_blank" rel="noopener" title="Open job description">${t}${EXT}</a>`:t;}
function salHTML(r){return (SHOW_SAL&&r.salary&&lvlOK(r.level))?`<span class="sal">${esc(r.salary)}</span>`:'';}
function roleCard(r){
  const chip=(r.level&&lvlOK(r.level))?`<span class="chip">${esc(r.level)}</span>`:'';
  const flag=(r.company&&r.company!=='Sprintax')?`<span class="flag">${esc(r.company)}</span>`:'';
  return `<div class="role-card" data-title="${esc((r.title||'').toLowerCase())}"><div class="rt">${roleTitleHTML(r)}</div><div class="rmeta">${chip}${salHTML(r)}${flag}</div></div>`;
}
function unitCardHTML(u,bare){

  const title=h.jd?`<a class="role-link" href="${esc(h.jd)}" target="_blank" rel="noopener">${esc(h.title)}</a>`:esc(h.title);
  const meta=sub||[lvlOK(h.level)?h.level:'',(SHOW_SAL&&h.salary&&lvlOK(h.level))?h.salary:''].filter(Boolean).join(' · ');
  return `<div class="node apex"><div class="role">${title}</div>${meta?`<div class="meta">${esc(meta)}</div>`:''}</div>`;
}
function apexHeader(title,sub,cf){
  const t=cf?`<a class="cf-apex" href="${esc(cf)}" target="_blank" rel="noopener" title="Open career framework">${esc(title)}${EXT}</a>`:esc(title);
  return `<div class="node apex"><div class="role">${t}</div>${sub?`<div class="meta">${esc(sub)}</div>`:''}</div>`;
}

/* ---- Level 0: Company ---- */
function renderCompany(){
  const ceo=apexRole(DATA.ceo,'Chief Executive Officer');
  const cards=DATA.functions.filter(f=>f.head||f.count).map(f=>{
    const h=f.head;
    const hmeta=h?[lvlOK(h.level)?h.level:'',(h.salary&&SHOW_SAL&&lvlOK(h.level))?h.salary:''].filter(Boolean).join(' · '):'';
    const hd=h?`<div class="hd">${esc(h.title)}${hmeta?`<small>${esc(hmeta)}</small>`:''}</div>`:`<div class="hd" style="color:var(--muted)">—</div>`;
    return `<li><div class="navcard" data-nav="function" data-fn="${esc(f.function)}" data-title="${esc(f.function.toLowerCase())}">
        <div class="ttl">${esc(f.function)}</div>${hd}
        <div class="cnt"><span>${f.count} role${f.count===1?'':'s'} · ${f.departments.length} dept${f.departments.length===1?'':'s'}</span><span class="open">Open ↗</span></div></div></li>`;
  }).join('');
  return `<div class="tree"><ul><li>${ceo}<ul>${cards}</ul></li></ul></div>`;
}

/* ---- Level 1: Function (head + department cards) ---- */
function renderFunctionView(f){
  const head=f.head?apexRole(f.head):apexHeader(f.function);
  let note='';
  if(['Commercial','Marketing','Finance'].includes(f.function))
    note=`<div class="note">Reporting lines and levels for ${esc(f.function)} are still being finalised in the source workbook, so departments here are grouped by area rather than by manager.</div>`;
  const cards=(f.departments||[]).map(d=>{
    const s=deptStats(d);
    const sub=s.leadTitle?`<div class="hd">${esc(s.leadTitle)}<small>Department lead</small></div>`:`<div class="hd" style="color:var(--muted)">${s.teamCount} team${s.teamCount===1?'':'s'}</div>`;
    return `<li><div class="navcard" data-nav="department" data-fn="${esc(f.function)}" data-dept="${esc(d.dept)}" data-title="${esc(d.dept.toLowerCase())}">
        <div class="ttl">${esc(d.dept)}</div>${sub}
        <div class="cnt"><span>${s.roleCount} role${s.roleCount===1?'':'s'}</span><span class="open">Open ↗</span></div></div></li>`;
  }).join('');
  const tree=cards?`<div class="tree"><ul><li>${head}<ul>${cards}</ul></li></ul></div>`:`<div class="tree"><ul><li>${head}</li></ul></div>`;
  return note+tree;
}

/* ---- Level 2: Department (lead/header + teams + roles) ---- */
function renderDepartmentView(f,d){
  const c=classify(d);
  let apex, childrenLIs;
  if(c.mode==='lead'){
    apex=leadApexWrap(c.lead.roles);
    childrenLIs=c.teams.map(u=>`<li>${unitCardHTML(u,false)}</li>`).join('');
  } else if(c.mode==='bare'){
    apex=apexHeader(d.dept,'',c.bare.cf);
    childrenLIs=`<li>${unitCardHTML(c.bare,true)}</li>`;
  } else {
    apex=apexHeader(d.dept);
    childrenLIs=c.teams.map(u=>`<li>${unitCardHTML(u,false)}</li>`).join('');
  }
  return `<div class="tree"><ul><li>${apex}<ul>${childrenLIs}</ul></li></ul></div>`;
}
// lead shown as an apex-styled teal box
function leadApexWrap(roles){
  const r=roles[0];
  const title=r.jd?`<a class="role-link" href="${esc(r.jd)}" target="_blank" rel="noopener">${esc(r.title)}</a>`:esc(r.title);
  const meta=[lvlOK(r.level)?r.level:'',(SHOW_SAL&&r.salary&&lvlOK(r.level))?r.salary:''].filter(Boolean).join(' · ');
  const extra=roles.slice(1).map(x=>`<div class="meta" style="margin-top:6px">${esc(x.title)}${(x.level&&lvlOK(x.level))?' · '+esc(x.level):''}</div>`).join('');
  return `<div class="node apex"><div class="role">${title}</div>${meta?`<div class="meta">${esc(meta)}</div>`:''}${extra}</div>`;
}

/* ---- crumbs ---- */
function renderCrumbs(){
  const el=document.getElementById('crumbs');
  const home=`<a data-nav="company">Company</a>`;
  if(VIEW.type==='company'){el.innerHTML=`<span class="cur">Company</span>`;return;}
  if(VIEW.type==='function'){el.innerHTML=`${home}<span class="sep">›</span><span class="cur">${esc(VIEW.fn)}</span>`;return;}
  el.innerHTML=`${home}<span class="sep">›</span><a data-nav="function" data-fn="${esc(VIEW.fn)}">${esc(VIEW.fn)}</a><span class="sep">›</span><span class="cur">${esc(VIEW.dept)}</span>`;
}

/* ---- tabs (primary + dynamic dept) ---- */
function buildTabs(){
  const tabs=document.getElementById('tabs');
  let html=`<div class="tab${VIEW.type==='company'?' active':''}" data-nav="company">Company</div>`;
  DATA.functions.forEach(f=>{
    const act=(VIEW.type!=='company' && VIEW.fn===f.function)?' active':'';
    html+=`<div class="tab${act}" data-nav="function" data-fn="${esc(f.function)}">${esc(f.function)}</div>`;
  });
  if(OPEN_DEPTS.length){
    html+=`<span class="tabsep"></span>`;
    OPEN_DEPTS.forEach(k=>{
      const [fn,dept]=k.split('||');
      const act=(VIEW.type==='department'&&VIEW.fn===fn&&VIEW.dept===dept)?' active':'';
      html+=`<div class="tab dept${act}" data-nav="department" data-fn="${esc(fn)}" data-dept="${esc(dept)}" title="${esc(fn)} › ${esc(dept)}">${esc(dept)}<span class="x" data-close="${esc(k)}">✕</span></div>`;
    });
  }
  tabs.innerHTML=html;
}

/* ---- navigation ---- */
function go(v){VIEW=v;render();}
function openDept(fn,dept){
  const k=fkey(fn,dept);
  if(!OPEN_DEPTS.includes(k)) OPEN_DEPTS.push(k);
  go({type:'department',fn,dept});
}
function closeDept(k){
  const i=OPEN_DEPTS.indexOf(k); if(i>=0)OPEN_DEPTS.splice(i,1);
  if(VIEW.type==='department'&&fkey(VIEW.fn,VIEW.dept)===k) go({type:'function',fn:k.split('||')[0]});
  else {buildTabs();}
}

function render(){
  buildTabs(); renderCrumbs();
  const canvas=document.getElementById('canvas');
  if(VIEW.type==='company') canvas.innerHTML=renderCompany();
  else if(VIEW.type==='function'){const f=getFn(VIEW.fn); canvas.innerHTML=f?renderFunctionView(f):'<div class="empty">Not found.</div>';}
  else {const f=getFn(VIEW.fn); const d=f&&f.departments.find(x=>x.dept===VIEW.dept); canvas.innerHTML=d?renderDepartmentView(f,d):'<div class="empty">Not found.</div>';}
  wire(); applySearch(); autoZoom();
}

function wire(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click',ev=>{
      if(ev.target && ev.target.dataset && ev.target.dataset.close){ ev.stopPropagation(); closeDept(ev.target.dataset.close); return; }
      const nav=el.dataset.nav;
      if(nav==='company') go({type:'company'});
      else if(nav==='function') go({type:'function',fn:el.dataset.fn});
      else if(nav==='department') openDept(el.dataset.fn,el.dataset.dept);
    });
  });
}

/* ---- zoom ---- */
let USER_ZOOM=false;   // true once the user manually zooms; keeps auto-fit from overriding them
function naturalW(){const t=document.querySelector('.tree');if(!t)return 0;const z=t.style.zoom;t.style.zoom=1;const w=t.offsetWidth;t.style.zoom=z||1;return w;}
function applyZoom(){const t=document.querySelector('.tree');if(t)t.style.zoom=ZOOM;}
function avail(){const c=document.getElementById('canvas');const cs=getComputedStyle(c);return c.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);}
// Fit the whole view to the visible width so there is no horizontal scrollbar on load.
function autoZoom(){const nw=naturalW();if(!nw)return;USER_ZOOM=false;ZOOM=Math.min(1,avail()/nw);applyZoom();zlabel();}
// Manual zoom: below fit shrinks further, above fit is where a scrollbar appears.
function setZoom(z){USER_ZOOM=true;ZOOM=Math.max(0.2,Math.min(2,z));applyZoom();zlabel();}
function zlabel(){document.getElementById('zFit').textContent=Math.round(ZOOM*100)+'%';}

/* ---- search ---- */
function applySearch(){
  const qel=document.getElementById('q');if(!qel)return;const q=(qel.value||'').trim().toLowerCase();
  const rc=document.querySelectorAll('.role-card'), boxes=document.querySelectorAll('.unit,.leadbox'), nav=document.querySelectorAll('.navcard');
  if(!q){rc.forEach(c=>c.classList.remove('dim','hit'));boxes.forEach(b=>b.classList.remove('dim'));nav.forEach(n=>n.classList.remove('dim','hit'));return;}
  rc.forEach(c=>{const h=(c.dataset.title||'').includes(q);c.classList.toggle('hit',h);c.classList.toggle('dim',!h);});
  boxes.forEach(b=>b.classList.toggle('dim',!b.querySelector('.role-card.hit')));
  nav.forEach(n=>{const h=(n.dataset.title||'').includes(q);n.classList.toggle('hit',h);n.classList.toggle('dim',!h);});
}

document.getElementById('q')?.addEventListener('input',applySearch);
document.getElementById('salT').addEventListener('change',e=>{SHOW_SAL=e.target.checked;render();});
document.getElementById('zIn').addEventListener('click',()=>setZoom(ZOOM+0.1));
document.getElementById('zOut').addEventListener('click',()=>setZoom(ZOOM-0.1));
document.getElementById('zFit').addEventListener('click',autoZoom);
window.addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>{if(!USER_ZOOM)autoZoom();},150);});
render();
</script>
</body>
</html>
